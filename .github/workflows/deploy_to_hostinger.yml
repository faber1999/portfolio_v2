name: Deployment to Hostinger via FTP

on:
  push:
    branches:
      - main
    # Cambios que no afectan a dist/ no disparan un deploy
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.claude/**'
  workflow_dispatch: # Permite lanzar el deploy manualmente desde GitHub

# Un solo deploy a la vez. Se encolan en vez de cancelarse para no cortar
# una subida FTP a mitad (el estado de sync solo se guarda al final).
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalar dependencias y construir el proyecto
      # Sin `version:`: la acción lee `packageManager` de package.json (pnpm@12.x).
      # pnpm 12 requiere pnpm/action-setup >= v6.1.0.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # pnpm/action-setup debe ir antes de setup-node para que `cache: pnpm` funcione
      # (usa pnpm-lock.yaml como clave de cache).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build project
        run: pnpm build # Genera la carpeta dist

      # 3. Sincronizar dist/ con el servidor FTP.
      # FTP-Deploy-Action compara hashes contra .ftp-deploy-sync-state.json en el
      # servidor: solo sube archivos nuevos/modificados y borra los que se
      # eliminaron de dist/ (p. ej. assets con hash viejo de Vite). Archivos que
      # nunca subió la acción no se tocan. Ojo: .htaccess ahora vive en
      # public/.htaccess, Vite lo copia a dist/ y se despliega con el build,
      # sobrescribiendo la copia del servidor (editarlo en el repo, no en Hostinger).
      # IMPORTANTE: no borrar .ftp-deploy-sync-state.json del servidor, o el
      # siguiente deploy volverá a subir todo.
      - name: Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          timeout: 120000
